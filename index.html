<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#08050f" />
    <!-- Google Search Console 소유 확인(구글 로그인 화면 브랜딩 인증용). 지우면 확인이 풀린다 -->
    <meta name="google-site-verification" content="2eneMhzKxZkSyb3rr4MkSzY9YyuJ4ix8BVF4U7IQFQQ" />
    <title>Shatter Stamp</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "GameFont";
        src: url("./fonts/game_font.ttf") format("truetype");
        font-weight: 700;
        font-display: block;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #090715;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        isolation: isolate;
        background:
          radial-gradient(ellipse at 18% 32%, #14304488, transparent 48%),
          radial-gradient(ellipse at 82% 58%, #51214b77, transparent 48%),
          linear-gradient(150deg, #0c0a1a, #090715 60%, #170d24);
      }
      body::before, body::after {
        content: "";
        position: fixed;
        pointer-events: none;
        z-index: -1;
      }
      body::before {
        inset: 55% -50% -70%;
        background-image:
          linear-gradient(#57d6f21c 1px, transparent 1px),
          linear-gradient(90deg, #57d6f21c 1px, transparent 1px);
        background-size: 80px 80px;
        transform: perspective(500px) rotateX(58deg);
        transform-origin: center top;
        mask-image: linear-gradient(transparent, black 40%, transparent 90%);
      }
      body::after {
        inset: 0;
        background:
          linear-gradient(115deg, transparent 20%, #61efff07 20.1%, transparent 20.2%),
          linear-gradient(65deg, transparent 80%, #ff70dd0b 80.1%, transparent 80.2%),
          radial-gradient(ellipse at center, transparent 25%, #06040d88 100%);
      }
      canvas {
        display: block;
        touch-action: none;
        box-shadow: 0 0 80px #11051a66;
      }
      /* 개인정보처리방침·약관 링크: 게임 화면 아래 여백에 작게 */
      .legal {
        position: fixed;
        z-index: 11;
        left: 0;
        right: 0;
        bottom: max(5px, env(safe-area-inset-bottom));
        text-align: center;
        font: 11px/1.5 system-ui, sans-serif;
        pointer-events: none;
      }
      .legal a {
        color: #b4b0c9;
        text-decoration: none;
        pointer-events: auto;
        padding: 5px 6px;
        text-shadow: 0 1px 5px #090715;
      }
      body.ingame .legal { display: none; }
      .legal a:hover { color: #e6e8f5; }
      .legal a:focus-visible { outline: 1px solid #40f2ff; outline-offset: 2px; border-radius: 2px; }
      /* Keep a footer gutter when the portrait canvas would otherwise fill the height.
         Pointer coordinates already use the canvas's displayed bounds. */
      @media (max-width: 899px), (max-height: 599px) {
        canvas {
          width: min(100vw, calc((100vh - 48px) * 0.5625)) !important;
          width: min(100vw, calc((100dvh - 48px - env(safe-area-inset-bottom, 0px) * 2) * 0.5625)) !important;
          height: auto !important;
        }
      }
      @media (min-width: 900px) and (min-height: 600px) {
        canvas {
          border-radius: 16px;
          box-shadow:
            0 0 0 1px #a68ac72e,
            -40px 0 140px #31d9ee12,
            40px 0 140px #ef44ca18,
            0 26px 80px #0009;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <nav class="legal"><a href="./privacy.html" data-i18n="LEGAL_PRIVACY">개인정보처리방침</a>·<a href="./terms.html" data-i18n="LEGAL_TERMS">이용약관</a></nav>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
