<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#08050f" />
    <title>Shatter Stamp</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "GameFont";
        src: url("./fonts/game_font.ttf") format("truetype");
        font-weight: 700;
        font-display: block;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #090715;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        isolation: isolate;
        background:
          radial-gradient(ellipse at 14% 28%, #14263788, transparent 45%),
          radial-gradient(ellipse at 86% 62%, #46204466, transparent 46%),
          linear-gradient(150deg, #0c0a1a, #090715 60%, #170d24);
      }
      body::before, body::after {
        content: "";
        position: fixed;
        pointer-events: none;
        z-index: -1;
      }
      body::before {
        inset: 55% -50% -70%;
        background-image:
          linear-gradient(#57d6f21c 1px, transparent 1px),
          linear-gradient(90deg, #57d6f21c 1px, transparent 1px);
        background-size: 80px 80px;
        transform: perspective(500px) rotateX(58deg);
        transform-origin: center top;
        mask-image: linear-gradient(transparent, black 40%, transparent 90%);
      }
      body::after {
        inset: 0;
        background:
          linear-gradient(115deg, transparent 20%, #61efff07 20.1%, transparent 20.2%),
          linear-gradient(65deg, transparent 80%, #ff70dd0b 80.1%, transparent 80.2%),
          radial-gradient(ellipse at center, transparent 25%, #06040d88 100%);
      }
      canvas {
        display: block;
        touch-action: none;
        box-shadow: 0 0 80px #11051a66;
      }
      /* 개인정보처리방침·약관 링크: 게임 화면 아래 여백에 작게 */
      .legal {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 3px;
        text-align: center;
        font: 11px/1.4 system-ui, sans-serif;
        pointer-events: none;
      }
      .legal a {
        color: #a5a4be99;
        text-decoration: none;
        pointer-events: auto;
        padding: 2px 4px;
      }
      .legal a:hover { color: #e6e8f5; }
      @media (min-width: 900px) and (min-height: 600px) {
        canvas {
          border-radius: 24px;
          box-shadow:
            0 0 0 1px #a68ac738,
            0 0 0 8px #12101ee6,
            0 0 0 9px #705b812e,
            -35px 0 110px #31d9ee0e,
            35px 0 110px #ef44ca12,
            0 26px 80px #0009;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <nav class="legal"><a href="./privacy.html">개인정보처리방침</a>·<a href="./terms.html">이용약관</a></nav>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
